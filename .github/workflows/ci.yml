name: CI

on:
  push:
    branches: [aria-dev, main]
  pull_request:
    branches: [aria-dev, main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm run check:push-guards
      - run: npm ci
      - run: npm test -- --run
      - env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run check
      - run: npm run smoke:runtime
      - env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build
      - run: npm run pack:smoke
