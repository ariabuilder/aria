name: CI

on:
  push:
    branches: [aria-dev, main]
  pull_request:
    branches: [aria-dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform-tests:
    permissions:
      contents: read
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test-command: npm test -- --run
          - os: windows-latest
            test-command: >-
              npm exec vitest -- run
              aria/tests/scripts/node-command.test.ts
              aria/tests/scripts/smoke-runtime-startup.test.ts
              aria/tests/scripts/deploy-cloudflare.test.ts
              aria/tests/scripts/cross-platform-scripts.test.ts
              aria/tests/storage/remote-d1.test.ts
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm run check:push-guards
      - run: npm ci
      - run: npm run check:type-safety
      - run: ${{ matrix.test-command }}
      - env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run check
      - run: npm run smoke:runtime
      - env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        run: npm run pack:smoke

  test:
    name: test
    if: ${{ always() }}
    needs: platform-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform test to pass
        env:
          PLATFORM_TESTS_RESULT: ${{ needs.platform-tests.result }}
        run: node -e "if (process.env.PLATFORM_TESTS_RESULT !== 'success') process.exit(1)"
