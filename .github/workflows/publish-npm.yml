name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22.18.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an npm version that supports trusted publishing
        run: npm install --global npm@latest

      - name: Verify release tag matches package version
        run: npm run release:check-version -- "${{ github.event.release.tag_name }}"

      - run: npm ci
      - run: npm run check:push-guards
      - run: npm test -- --run
      - env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run check
      - env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build
      - run: npm run pack:smoke
      - run: npm pack --dry-run
      - run: npm publish --access public
