name: Bug report
description: Report a reproducible problem in Aria.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, tokens, private user data, or production exports.

        Security issues should be reported privately using SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Provide the smallest reliable reproduction you can.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Click ...
        4. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Aria Version or Commit
      placeholder: "0.5.7, main, or commit SHA"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node Version
      placeholder: "22.18.0"
    validations:
      required: false
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - npm run dev
        - npm run dev:edge
        - npm run build / preview
        - Deployed Cloudflare Worker
        - Other
    validations:
      required: true
  - type: checkboxes
    id: services
    attributes:
      label: Cloudflare Services Involved
      options:
        - label: D1
        - label: R2
        - label: KV
        - label: Queues
        - label: Durable Objects
        - label: Workers AI
        - label: Email
        - label: None / not sure
  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Paste relevant logs or attach screenshots. Remove secrets first.
      render: shell
    validations:
      required: false
